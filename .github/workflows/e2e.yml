name: e2e

on:
  push:
    branches: [ijcd/main, ijcd/test-suite-baseline]
  pull_request:
    branches: [ijcd/main]

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Stub credentials.js
        run: |
          cat > src/credentials.js <<'EOF'
          export const clientId = "ci-client-id";
          export const clientSecret = "ci-client-secret";
          EOF

      - name: Run e2e (Chrome)
        run: node node_modules/.bin/playwright test --config e2e/playwright.config.js --project=chrome-mv3 --reporter=line

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
